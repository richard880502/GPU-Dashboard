# Standalone deployment: brings up the full dashboard (Prometheus + Grafana +
# nginx) on a brand new machine using ONLY the images below -- no git clone,
# no repo checkout. Scrape config / alert rules / Grafana dashboards are all
# baked into these images already (see deploy/docker/*-dashboard/Dockerfile
# in the main repo if you need to change what's in them and rebuild).
#
# Usage:
#   mkdir -p data/prometheus data/grafana && chmod 777 data/prometheus data/grafana
#   GRAFANA_ADMIN_PASSWORD=<pick one> docker compose up -d
services:
  prometheus:
    image: ghcr.io/richard880502/gpu-dashboard/prometheus-dashboard:v1.1.0
    container_name: prometheus
    restart: always
    volumes:
      - ./data/prometheus:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=1d
    ports:
      - "9090:9090"

  grafana:
    image: ghcr.io/richard880502/gpu-dashboard/grafana-dashboard:v1.1.0
    container_name: grafana
    restart: always
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-changeme}
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_DASHBOARDS_MIN_REFRESH_INTERVAL=1s
    volumes:
      - ./data/grafana:/var/lib/grafana
    depends_on:
      - prometheus
    ports:
      - "13000:3000"

  nginx:
    image: ghcr.io/richard880502/gpu-dashboard/nginx-dashboard:v1.1.0
    container_name: nginx
    restart: always
    depends_on:
      - grafana
    ports:
      - "80:80"
