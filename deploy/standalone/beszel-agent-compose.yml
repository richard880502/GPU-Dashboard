# Beszel agent -- gpu-monitoring's own fork (deploy/beszel-fork), pilot stage.
# Run this on every GPU server, pointed at the one host running
# beszel-hub-compose.yml.
#
# PILOT STATUS: the image below is NOT published to any registry yet --
# build it locally first from the vendored fork:
#   cd deploy/beszel-fork
#   docker build -f internal/dockerfile_agent_nvidia -t beszel-agent-nvidia-fork:test .
#
# GPU_COLLECTOR=nvidia-smi is REQUIRED, not optional: Beszel's own NVML
# collector silently drops GPU temperature on some hosts (an ignored NVML
# return code -- see docs/beszel-integration-research.md), while nvidia-smi
# was verified reliable on every host in this cluster. Don't remove this
# override when redeploying.
#
# HUB_SSH_PUBLIC_KEY is the public key Beszel's hub generates for itself on
# first start (readable from the hub container's data dir, or from the
# "Add system" dialog in the Beszel UI) -- it's public key material, safe
# to keep in this file once filled in for your own deployment.
#
# Usage:
#   HUB_HOST=192.168.1.76 HUB_SSH_PUBLIC_KEY="ssh-ed25519 AAAA..." \
#     docker compose -f beszel-agent-compose.yml up -d
services:
  beszel-agent:
    image: beszel-agent-nvidia-fork:test
    container_name: beszel-agent
    restart: unless-stopped
    network_mode: host
    gpus: all
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - beszel_agent_data:/var/lib/beszel-agent
    environment:
      - LISTEN=45876
      - HUB_URL=http://${HUB_HOST:?set HUB_HOST}:18090
      - KEY=${HUB_SSH_PUBLIC_KEY:?set HUB_SSH_PUBLIC_KEY}
      - GPU_COLLECTOR=nvidia-smi

volumes:
  beszel_agent_data:
