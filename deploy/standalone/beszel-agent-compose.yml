# Beszel agent -- gpu-monitoring's own fork (deploy/beszel-fork), published
# to GHCR. Run this on every GPU server, pointed at the one host running
# beszel-hub-compose.yml.
#
# To build from source instead of pulling:
#   cd deploy/beszel-fork
#   docker build -f internal/dockerfile_agent_nvidia -t beszel-agent-nvidia-fork:test .
#
# GPU_COLLECTOR defaults to nvidia-smi, not optional on the amd64 fleet:
# Beszel's own NVML collector silently drops GPU temperature on some hosts
# (an ignored NVML return code -- see docs/beszel-integration-research.md),
# while nvidia-smi was verified reliable on every amd64 host in this cluster.
# Don't remove this default when redeploying those hosts.
#
# Exception: wingene-82 (GB10, unified memory) needs
# GPU_COLLECTOR=nvml,nvidia-smi -- nvidia-smi's CLI output reports
# memory.used/memory.total as "[N/A]" on this chip (no dedicated VRAM to
# report), while NVML's nvmlDeviceGetMemoryInfo call works fine on it
# (verified: matches nvitop-exporter's numbers). Override via
# GPU_COLLECTOR=nvml,nvidia-smi ... docker compose -f beszel-agent-compose.yml
# up -d on that host only.
#
# HUB_SSH_PUBLIC_KEY is the public key Beszel's hub generates for itself on
# first start (readable from the hub container's data dir, or from the
# "Add system" dialog in the Beszel UI) -- it's public key material, safe to
# commit. Not filled in below because it doesn't exist until the hub has
# started at least once; fill it in after that (see README.md section 2).
#
# SMART disk monitoring (https://beszel.dev/guide/smart-data) needs the base
# controller device(s) passed through -- not partitions -- plus SYS_RAWIO
# (SATA/ATA) and SYS_ADMIN (NVMe) capabilities. smartmontools is already
# built into this image. Device paths differ per host -- check with
# `lsblk -d -o NAME,TYPE,SIZE,MODEL` first (map the base name, e.g. nvme0,
# not nvme0n1) and set SMART_DEVICE_1/2 accordingly; leave SMART_DEVICE_2
# unset (defaults to the same as _1, so no duplicate) on single-drive hosts.
# After first start, trigger an initial read:
#   curl -X POST "$HUB_URL/api/beszel/smart/refresh?system=<system id>" \
#     -H "Authorization: Bearer <token>"
#
# Usage:
#   HUB_SSH_PUBLIC_KEY="ssh-ed25519 AAAA..." SMART_DEVICE_1=/dev/nvme0 SMART_DEVICE_2=/dev/nvme1 \
#     docker compose -f beszel-agent-compose.yml up -d
services:
  beszel-agent:
    image: ghcr.io/richard880502/gpu-dashboard/beszel-agent-nvidia:v2.7.3
    container_name: beszel-agent
    restart: unless-stopped
    network_mode: host
    gpus: all
    cap_add:
      - SYS_RAWIO
      - SYS_ADMIN
    devices:
      - ${SMART_DEVICE_1:?set SMART_DEVICE_1, e.g. /dev/nvme0 (see lsblk -d)}:${SMART_DEVICE_1:?}
      - ${SMART_DEVICE_2:-${SMART_DEVICE_1:?}}:${SMART_DEVICE_2:-${SMART_DEVICE_1:?}}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - beszel_agent_data:/var/lib/beszel-agent
    environment:
      - LISTEN=45876
      - HUB_URL=http://192.168.1.76:13000
      - KEY=${HUB_SSH_PUBLIC_KEY:?set HUB_SSH_PUBLIC_KEY}
      - GPU_COLLECTOR=${GPU_COLLECTOR:-nvidia-smi}

volumes:
  beszel_agent_data:
