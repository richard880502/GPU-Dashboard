# Beszel hub -- gpu-monitoring's own fork (deploy/beszel-fork), published to
# GHCR. Run this on ONE machine only (the monitoring_server in
# inventory/servers.yaml, currently wingene-76). Every GPU server then runs
# beszel-agent-compose.yml pointed at this hub.
#
# See docs/beszel-integration-research.md for the full build/deploy log and
# every bug fixed along the way (GPU_COLLECTOR override, exporter
# /etc/passwd mount, etc.). To build from source instead of pulling:
#   cd deploy/beszel-fork
#   bun install --cwd internal/site && bun run --cwd internal/site build
#   docker build -f internal/dockerfile_hub -t beszel-hub-fork:test .
#
# Usage (first run -- creates the account named by USER_EMAIL):
#   mkdir -p ../beszel/data && chmod 777 ../beszel/data
#   cp .env.example .env   # set a real USER_PASSWORD
#   docker compose -f beszel-hub-compose.yml up -d
#
# On later runs (account already exists), USER_EMAIL/USER_PASSWORD are
# ignored -- AUTO_LOGIN alone is enough. AUTO_LOGIN doesn't need to be a
# real, reachable email; it just has to match an existing account's email
# field exactly (PocketBase's own user model, not a Beszel-specific thing).
#
# UPDATE_INTERVAL_MS optionally overrides how often (in milliseconds) the
# hub polls each agent for fresh stats -- defaults to 30000 (30s, already
# lowered from upstream's 60s default for fresher GPU/process data). Add
# "- UPDATE_INTERVAL_MS=10000" etc. under environment below to change it.
#
# APP_URL and ACCOUNT_EMAIL default to this cluster's own values (wingene,
# 192.168.1.76) so existing deployments work unchanged with no env vars
# set. Spinning up a genuinely separate cluster (its own hub, not another
# system joining this one) needs both overridden to that cluster's own
# values -- APP_URL to the new hub host's own IP, ACCOUNT_EMAIL to whatever
# you want (doesn't need to be reachable, just has to match consistently
# between USER_EMAIL and AUTO_LOGIN, both driven by this one var here):
#   mkdir -p ../beszel/data && chmod 777 ../beszel/data
#   APP_URL=http://<new hub host's IP>:13000 ACCOUNT_EMAIL=newcluster@internal.local \
#     USER_PASSWORD=<pick a real password> docker compose -f beszel-hub-compose.yml up -d
# Then fetch this new hub's own SSH public key (its data dir, or the "Add
# system" dialog in its UI) -- beszel-agent-compose.yml on this cluster's
# hosts needs HUB_URL and HUB_SSH_PUBLIC_KEY overridden to match.
services:
  beszel-hub:
    image: ghcr.io/richard880502/gpu-dashboard/beszel-hub:v2.7.6
    container_name: beszel
    restart: unless-stopped
    # this host runs 100+ unrelated containers and has exhausted Docker's
    # predefined subnet pool -- join the pre-existing default bridge network
    # instead of letting Compose create a fresh one for this project.
    network_mode: bridge
    environment:
      - AUTO_LOGIN=${ACCOUNT_EMAIL:-wingene@internal.local}
      - APP_URL=${APP_URL:-http://192.168.1.76:13000}
      - USER_EMAIL=${ACCOUNT_EMAIL:-wingene@internal.local}
      - USER_PASSWORD=${USER_PASSWORD:?set USER_PASSWORD (copy .env.example to .env first)}
    volumes:
      - ../beszel/data:/beszel_data
    ports:
      - "13000:8090"
