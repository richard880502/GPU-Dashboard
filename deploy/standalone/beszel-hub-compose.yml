# Beszel hub -- gpu-monitoring's own fork (deploy/beszel-fork), pilot stage.
# Run this on ONE machine only (the same one that runs the main Grafana
# stack, e.g. the monitoring_server in inventory/servers.yaml). Every GPU
# server then runs beszel-agent-compose.yml pointed at this hub.
#
# PILOT STATUS: the image below is NOT published to any registry yet --
# build it locally first from the vendored fork:
#   cd deploy/beszel-fork
#   bun install --cwd internal/site && bun run --cwd internal/site build
#   docker build -f internal/dockerfile_hub -t beszel-hub-fork:test .
# (see docs/beszel-integration-research.md for the full build/deploy log
# and every bug fixed along the way -- GPU_COLLECTOR override, exporter
# /etc/passwd mount, etc.)
#
# Usage:
#   mkdir -p data && chmod 777 data
#   AUTO_LOGIN_EMAIL=you@example.com APP_HOST=192.168.1.76 docker compose -f beszel-hub-compose.yml up -d
services:
  beszel-hub:
    image: beszel-hub-fork:test
    container_name: beszel
    restart: unless-stopped
    environment:
      - AUTO_LOGIN=${AUTO_LOGIN_EMAIL:?set AUTO_LOGIN_EMAIL}
      - APP_URL=http://${APP_HOST:?set APP_HOST}:18090
    volumes:
      - ./data:/beszel_data
    ports:
      - "18090:8090"
