# Evaluated by Prometheus and visible under Alerts in its own UI.
# No Alertmanager is deployed yet (out of MVP scope) so nothing is routed
# anywhere until one is added later — this just gives early visual signal.
groups:
  - name: gpu-alerts
    rules:
      - alert: GPUTemperatureHigh
        expr: gpu_temperature_C > 85
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.server }} GPU {{ $labels.index }} temperature {{ $value }}°C"

      - alert: GPUMemoryNearFull
        expr: gpu_memory_percent_Percentage > 95
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.server }} GPU {{ $labels.index }} VRAM {{ $value }}% used"

      - alert: GPUExporterDown
        expr: up{job="gpu-servers"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "nvitop-exporter on {{ $labels.server }} ({{ $labels.instance }}) is down"

      - alert: GPUPossibleZombieProcess
        expr: gpu_utilization_Percentage < 5 and gpu_memory_percent_Percentage > 80
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.server }} GPU {{ $labels.index }} idle util but VRAM held >30m (possible stuck process)"
