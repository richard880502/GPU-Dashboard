global:
  scrape_interval: 1s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/gpu-alerts.yml

scrape_configs:
  - job_name: gpu-servers
    static_configs:
      - targets: ['192.168.1.76:5051']
        labels:
          server: wingene-76
      - targets: ['192.168.1.77:5051']
        labels:
          server: wingene-77
      - targets: ['192.168.1.78:5051']
        labels:
          server: wingene-78
      - targets: ['192.168.1.79:5051']
        labels:
          server: wingene-79
      - targets: ['192.168.1.80:5051']
        labels:
          server: wingene-80
      - targets: ['192.168.1.82:5051']
        labels:
          server: wingene-82

  - job_name: gpu-process-containers
    static_configs:
      - targets: ['192.168.1.76:5052']
        labels:
          server: wingene-76
      - targets: ['192.168.1.77:5052']
        labels:
          server: wingene-77
      - targets: ['192.168.1.78:5052']
        labels:
          server: wingene-78
      - targets: ['192.168.1.79:5052']
        labels:
          server: wingene-79
      - targets: ['192.168.1.80:5052']
        labels:
          server: wingene-80
      - targets: ['192.168.1.82:5052']
        labels:
          server: wingene-82

  - job_name: node-exporter
    # host metrics (CPU%/RAM/disk/temp) don't need 1s resolution like the GPU
    # jobs do, and forcing it caused node-exporter on a slower/remote box
    # (wingene-82) to fall behind and hit its own concurrent-request limit,
    # serving 503s for everything instead of just the collectors that were slow.
    scrape_interval: 5s
    static_configs:
      - targets: ['192.168.1.76:9100']
        labels:
          hostname: wingene-76
      - targets: ['192.168.1.77:9100']
        labels:
          hostname: wingene-77
      - targets: ['192.168.1.78:9100']
        labels:
          hostname: wingene-78
      - targets: ['192.168.1.79:9100']
        labels:
          hostname: wingene-79
      - targets: ['192.168.1.80:9100']
        labels:
          hostname: wingene-80
      - targets: ['192.168.1.82:9100']
        labels:
          hostname: wingene-82

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
