global:
  scrape_interval: 5s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/gpu-alerts.yml

scrape_configs:
  - job_name: gpu-servers
    static_configs:
      - targets: ['192.168.1.76:5051']
        labels:
          server: wingene-76
      - targets: ['192.168.1.77:5051']
        labels:
          server: wingene-77
      - targets: ['192.168.1.78:5051']
        labels:
          server: wingene-78
      - targets: ['192.168.1.79:5051']
        labels:
          server: wingene-79
      - targets: ['192.168.1.80:5051']
        labels:
          server: wingene-80

  - job_name: gpu-process-containers
    static_configs:
      - targets: ['192.168.1.76:5052']
        labels:
          server: wingene-76
      - targets: ['192.168.1.77:5052']
        labels:
          server: wingene-77
      - targets: ['192.168.1.78:5052']
        labels:
          server: wingene-78
      - targets: ['192.168.1.79:5052']
        labels:
          server: wingene-79
      - targets: ['192.168.1.80:5052']
        labels:
          server: wingene-80

  - job_name: node-exporter
    static_configs:
      - targets: ['192.168.1.76:9100']
        labels:
          hostname: wingene-76
      - targets: ['192.168.1.77:9100']
        labels:
          hostname: wingene-77
      - targets: ['192.168.1.78:9100']
        labels:
          hostname: wingene-78
      - targets: ['192.168.1.79:9100']
        labels:
          hostname: wingene-79
      - targets: ['192.168.1.80:9100']
        labels:
          hostname: wingene-80

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
