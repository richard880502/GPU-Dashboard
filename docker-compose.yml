# Dev/live deployment: bind-mounts config from this repo checkout (edit
# prometheus/prometheus.yml or grafana/provisioning/... and `docker compose
# restart <service>` -- no rebuild needed). This is what's actually running
# the monitoring stack.
#
# Want to deploy the dashboard on ANOTHER machine without cloning this repo?
# Use deploy/standalone/docker-compose.yml instead -- same result, but the
# config is baked into published images, so it's just docker-compose up with
# one small file. Trade-off: that version needs an image rebuild+push for any
# config change, this one just needs a file edit + restart.
services:
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: always
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - ./data/prometheus:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=1d
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: always
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-changeme}
      # internal network only — skip the login screen, land straight on dashboards.
      # admin login is still available at /login for editing.
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      # allow the 1s refresh option (default min is 5s)
      - GF_DASHBOARDS_MIN_REFRESH_INTERVAL=1s
      # NOTE: setting our dashboard as the home page needs one extra API call
      # after startup (the UID is auto-generated per instance) -- see
      # "Default home dashboard" in README.md, don't rely on an env var here.
    volumes:
      - ./data/grafana:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    ports:
      - "13000:3000"

  nginx:
    image: nginx:latest
    container_name: nginx
    restart: always
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - grafana
    ports:
      - "80:80"
